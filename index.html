<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KEIBA-EV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
/* ── Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#18181f;--bg4:#1e1e28;
  --border:#2a2a38;--border2:#3a3a50;
  --fg:#e8e8f0;--fg2:#a0a0b8;--fg3:#606078;
  --green:#00e5a0;--green2:#00c880;--green-dim:#00e5a020;
  --red:#ff4060;--red-dim:#ff406015;
  --yellow:#ffd060;--yellow-dim:#ffd06015;
  --blue:#4080ff;--blue-dim:#4080ff15;
  --purple:#a060ff;
  --font-mono:'JetBrains Mono',monospace;
  --font-jp:'Noto Sans JP',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font-jp)}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
input,select{font-family:var(--font-jp);background:var(--bg3);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:8px 12px;width:100%;font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--green)}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;position:relative}
#header{padding:12px 16px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
#header-top{display:flex;align-items:center;justify-content:space-between}
#logo{font-family:var(--font-mono);font-size:18px;font-weight:700;letter-spacing:2px;color:var(--green)}
#logo span{color:var(--fg3);font-weight:300}
#kill-badge{font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:4px;letter-spacing:1px}
#kill-badge.running{background:var(--green-dim);color:var(--green);border:1px solid var(--green)}
#kill-badge.stopped{background:var(--red-dim);color:var(--red);border:1px solid var(--red)}

/* RMRF λ indicator */
#lambda-bar{display:flex;align-items:center;gap:8px;margin-top:6px;padding:5px 8px;background:var(--bg3);border-radius:6px;border:1px solid var(--border)}
#lambda-label{font-family:var(--font-mono);font-size:9px;color:var(--fg3);letter-spacing:1px}
#lambda-track{flex:1;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden}
#lambda-fill{height:100%;border-radius:2px;transition:width .5s,background .5s}
#lambda-val{font-family:var(--font-mono);font-size:10px;font-weight:600;min-width:32px;text-align:right}
#edge-badge{font-family:var(--font-mono);font-size:9px;padding:2px 6px;border-radius:3px}

/* Nav */
#nav{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.nav-btn{flex:1;padding:10px 4px;font-size:11px;font-family:var(--font-mono);color:var(--fg3);letter-spacing:.5px;border-bottom:2px solid transparent;transition:all .2s}
.nav-btn.active{color:var(--green);border-bottom-color:var(--green)}

/* Screens */
#screens{flex:1;overflow-y:auto;overscroll-behavior:contain}
.screen{display:none;padding:12px}
.screen.active{display:block}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.card-title{font-family:var(--font-mono);font-size:10px;color:var(--fg3);letter-spacing:1px;margin-bottom:8px}

/* Race list */
.race-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .2s,background .2s}
.race-card:hover{border-color:var(--border2);background:var(--bg3)}
.race-card.has-pick{border-color:var(--green);background:var(--green-dim)}
.race-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.race-name{font-size:13px;font-weight:700}
.race-grade{font-family:var(--font-mono);font-size:9px;padding:2px 6px;border-radius:3px;background:var(--bg4);color:var(--fg2)}
.race-meta{font-family:var(--font-mono);font-size:10px;color:var(--fg3)}
.pick-row{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg3);border-radius:6px;margin-top:6px}
.pick-horse{font-size:12px;font-weight:700;flex:1}
.ev-badge{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px}
.ev-badge.strong{background:var(--green-dim);color:var(--green);border:1px solid var(--green)}
.ev-badge.weak{background:var(--yellow-dim);color:var(--yellow);border:1px solid var(--yellow)}

/* RMRF multi-pick warning */
.multi-warning{font-family:var(--font-mono);font-size:9px;color:var(--yellow);background:var(--yellow-dim);border:1px solid var(--yellow);border-radius:4px;padding:3px 8px;margin-top:4px;display:flex;align-items:center;gap:4px}

/* Calibration */
.calib-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.calib-label{font-family:var(--font-mono);font-size:10px;color:var(--fg2);width:70px}
.calib-bar-wrap{flex:1;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.calib-bar{height:100%;border-radius:3px}
.calib-val{font-family:var(--font-mono);font-size:10px;width:40px;text-align:right}

/* EV calc */
.horse-input-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.horse-num{font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:20px}
.horse-inputs{display:flex;gap:6px;flex:1}
.horse-inputs input{padding:6px 8px;font-size:13px}
.ev-result{font-family:var(--font-mono);font-size:11px;text-align:right;white-space:nowrap;padding:3px 6px;border-radius:4px;min-width:64px}
.ev-ok{background:var(--green-dim);color:var(--green)}
.ev-ng{background:var(--red-dim);color:var(--red);opacity:.6}
.rm-btn{font-size:16px;color:var(--fg3);padding:0 4px}

/* Records */
.record-row{display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.record-horse{flex:1;font-size:12px;font-weight:600}
.record-result{font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:4px}
.result-win{background:var(--green-dim);color:var(--green)}
.result-lose{background:var(--red-dim);color:var(--red)}
.record-pnl{font-family:var(--font-mono);font-size:11px;font-weight:700;min-width:60px;text-align:right}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px}
.stat-label{font-family:var(--font-mono);font-size:9px;color:var(--fg3);letter-spacing:.5px;margin-bottom:4px}
.stat-val{font-family:var(--font-mono);font-size:18px;font-weight:700}
.stat-val.pos{color:var(--green)}
.stat-val.neg{color:var(--red)}
.stat-val.neu{color:var(--fg)}

/* Section */
.section-head{font-family:var(--font-mono);font-size:10px;color:var(--fg3);letter-spacing:1px;margin:12px 0 6px}

/* Buttons */
.btn{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:.5px;transition:all .2s}
.btn-green{background:var(--green);color:#000}
.btn-green:hover{background:var(--green2)}
.btn-outline{border:1px solid var(--border2);color:var(--fg2)}
.btn-outline:hover{border-color:var(--green);color:var(--green)}
.btn-red{background:var(--red-dim);color:var(--red);border:1px solid var(--red)}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn{flex:1}

/* Detail */
.horse-ev-row{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--border)}
.horse-rank{font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:24px}
.horse-info{flex:1}
.horse-name-big{font-size:13px;font-weight:700}
.horse-sub{font-family:var(--font-mono);font-size:10px;color:var(--fg3)}
.kelly-bar-wrap{width:60px;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;margin-top:3px}
.kelly-bar{height:100%;background:var(--green);border-radius:2px}

/* Modal */
#modal-overlay{display:none;position:fixed;inset:0;background:#00000090;z-index:100;align-items:flex-end;justify-content:center}
#modal-overlay.open{display:flex}
#modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-title{font-family:var(--font-mono);font-size:12px;color:var(--fg3);letter-spacing:1px;margin-bottom:14px}
.form-row{margin-bottom:10px}
.form-label{font-family:var(--font-mono);font-size:10px;color:var(--fg3);margin-bottom:4px;display:block;letter-spacing:.5px}

/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--fg3);font-family:var(--font-mono);font-size:12px;line-height:1.8}

/* Tag */
.tag{display:inline-block;font-family:var(--font-mono);font-size:9px;padding:2px 6px;border-radius:3px;margin-left:4px}
.tag-rmrf{background:#a060ff20;color:var(--purple);border:1px solid var(--purple)}

/* Scrollbar */
#screens::-webkit-scrollbar{width:3px}
#screens::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* Toast */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--green);color:var(--green);font-family:var(--font-mono);font-size:12px;padding:8px 16px;border-radius:8px;opacity:0;transition:all .3s;pointer-events:none;z-index:200;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-top">
      <div id="logo">KEIBA<span>·</span>EV</div>
      <div id="kill-badge" class="running">● RUNNING</div>
    </div>
    <!-- RMRF 2.1: 動的λ表示バー -->
    <div id="lambda-bar">
      <span id="lambda-label">λ-RMRF</span>
      <div id="lambda-track"><div id="lambda-fill"></div></div>
      <span id="lambda-val">—</span>
      <span id="edge-badge">—</span>
    </div>
  </div>

  <div id="nav">
    <button class="nav-btn active" onclick="showScreen('week')">今週</button>
    <button class="nav-btn" onclick="showScreen('calc')">EV計算</button>
    <button class="nav-btn" onclick="showScreen('records')">収支</button>
    <button class="nav-btn" onclick="showScreen('stats')">分析</button>
  </div>

  <div id="screens">
    <!-- ── 今週 ── -->
    <div id="screen-week" class="screen active">
      <div id="week-list"><div class="empty">読み込み中…</div></div>
    </div>

    <!-- ── EV計算 ── -->
    <div id="screen-calc" class="screen">
      <div class="card">
        <div class="card-title">レース情報</div>
        <div class="form-row">
          <label class="form-label">レース名</label>
          <input type="text" id="calc-race-name" placeholder="例：天皇賞（春）">
        </div>
        <div style="display:flex;gap:8px">
          <div class="form-row" style="flex:1">
            <label class="form-label">銀行ロール（円）</label>
            <input type="number" id="calc-bankroll" placeholder="100000" value="100000">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">出走馬 <span style="color:var(--fg3)">（馬名 / 自社確率% / 単勝オッズ）</span></div>
        <div id="horse-list"></div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn btn-outline" onclick="addHorse()">＋ 馬を追加</button>
          <button class="btn btn-green" onclick="calcEV()">EV計算</button>
        </div>
      </div>

      <!-- RMRF 2.1: マルチケリー最適化結果 -->
      <div class="card" id="calc-result" style="display:none">
        <div class="card-title">ベット推奨 <span class="tag tag-rmrf">RMRF 2.1</span></div>
        <div id="calc-result-body"></div>
      </div>
    </div>

    <!-- ── 収支 ── -->
    <div id="screen-records" class="screen">
      <div class="btn-row" style="margin-bottom:10px">
        <button class="btn btn-green" onclick="openRecordModal()">＋ 記録追加</button>
      </div>
      <div id="record-list"><div class="empty">記録なし</div></div>
    </div>

    <!-- ── 分析 ── -->
    <div id="screen-stats" class="screen">
      <div class="stat-grid" id="stat-grid"></div>

      <!-- RMRF 2.1: 動的λ履歴 -->
      <div class="section-head">動的ケリー係数 <span class="tag tag-rmrf">RMRF 2.1</span></div>
      <div class="card">
        <div class="card-title">λ推移（直近20件）</div>
        <div id="lambda-history-chart" style="height:60px;position:relative;margin-top:4px"></div>
        <div style="margin-top:8px;font-family:var(--font-mono);font-size:10px;color:var(--fg3);line-height:1.8" id="lambda-explain"></div>
      </div>

      <!-- RMRF 2.1: 較正 -->
      <div class="section-head">確率較正 <span class="tag tag-rmrf">RMRF 2.1</span></div>
      <div class="card">
        <div class="card-title">自社確率 vs 市場確率 — 乖離モニター</div>
        <div id="calib-body"><div class="empty" style="padding:10px;font-size:10px">的中記録が10件以上で表示されます</div></div>
      </div>

      <!-- ドローダウン -->
      <div class="section-head">ドローダウン</div>
      <div class="card">
        <div id="dd-body"></div>
      </div>
    </div>
  </div>
</div>

<!-- Detail Screen (overlay) -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
// グローバル状態
// ══════════════════════════════════════════════════════════
let horses = [];       // EV計算タブ
let records = [];      // 収支記録
let shuTubaData = [];  // shutuba.json
let racesData = [];    // races.json
let allPicks = [];     // buildPicksが生成
let courseStats = {};  // コース別統計
let systemRunning = true;

// ── RMRF 2.1: 動的λ状態 ──
// 収支履歴からリアルタイムに計算する。localStorageに永続化。
let rmrfState = {
  lambdaMax: 0.25,      // 最大Kelly分数（1/4Kelly上限）
  ddThreshold: 0.20,    // Kill Switch DD閾値
  gamma: 2.0,           // 不確実性ペナルティ強度
  currentLambda: null,  // 最後に計算されたλ
  calibData: []         // 較正データ [{myP, mktP, won}]
};

// ══════════════════════════════════════════════════════════
// localStorage
// ══════════════════════════════════════════════════════════
function saveLocal(){
  localStorage.setItem('keibaev_records', JSON.stringify(records));
  localStorage.setItem('keibaev_rmrf', JSON.stringify(rmrfState));
}
function loadLocal(){
  try{records=JSON.parse(localStorage.getItem('keibaev_records')||'[]');}catch{records=[];}
  try{rmrfState={...rmrfState,...JSON.parse(localStorage.getItem('keibaev_rmrf')||'{}')};}catch{}
}

// ══════════════════════════════════════════════════════════
// ナビゲーション
// ══════════════════════════════════════════════════════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  [...document.querySelectorAll('.nav-btn')].find(b=>b.textContent.includes(
    {week:'今週',calc:'EV',records:'収支',stats:'分析'}[id]
  ))?.classList.add('active');
  if(id==='stats') renderStats();
  if(id==='records') renderRecords();
}

// ══════════════════════════════════════════════════════════
// データ取得
// ══════════════════════════════════════════════════════════
async function loadData(){
  try{
    const [s,r]=await Promise.all([
      fetch('data/shutuba.json').catch(()=>null),
      fetch('data/races.json').catch(()=>null)
    ]);
    if(s&&s.ok) shuTubaData=await s.json();
    if(r&&r.ok) racesData=await r.json();
  }catch(e){console.warn('data load:',e);}
  buildCourseStats();
  buildPicks();
  renderLambdaBar();
}

// ══════════════════════════════════════════════════════════
// コース統計（スピード指数用）
// ══════════════════════════════════════════════════════════
function buildCourseStats(){
  courseStats={};
  racesData.forEach(race=>{
    const key=`${race.venue}_${race.track}_${race.distance}`;
    if(!courseStats[key]) courseStats[key]={times:[]};
    race.horses?.forEach(h=>{
      if(!h.time) return;
      const secs=parseTime(h.time);
      if(secs>0) courseStats[key].times.push(secs);
    });
  });
  Object.keys(courseStats).forEach(k=>{
    const t=courseStats[k].times;
    if(t.length>=5){
      const mu=t.reduce((a,b)=>a+b,0)/t.length;
      const sigma=Math.sqrt(t.map(x=>(x-mu)**2).reduce((a,b)=>a+b,0)/t.length);
      courseStats[k]={mu,sigma,n:t.length};
    }else{
      delete courseStats[k];
    }
  });
}
function parseTime(s){
  if(!s||typeof s!=='string') return 0;
  const m=s.match(/^(\d+):(\d+\.\d+)$/);
  return m?parseFloat(m[1])*60+parseFloat(m[2]):0;
}

// ══════════════════════════════════════════════════════════
// スピード指数
// ══════════════════════════════════════════════════════════
function calcSpeedRating(horseName){
  const key3=horseName.slice(0,3);
  const weights=[0.35,0.25,0.20,0.12,0.08];
  const condPenalty={良:0,稍重:-1,重:-3,不良:-5};
  let results=[];
  racesData.forEach(race=>{
    const ck=`${race.venue}_${race.track}_${race.distance}`;
    if(!courseStats[ck]) return;
    const {mu,sigma}=courseStats[ck];
    if(sigma===0) return;
    const h=race.horses?.find(h=>h.name?.startsWith(key3));
    if(!h?.time) return;
    const secs=parseTime(h.time);
    if(!secs) return;
    let rating=(mu-secs)/sigma*10+50;
    rating+=(condPenalty[race.cond]||0);
    results.push(rating);
  });
  if(results.length===0) return 40;
  const recent=results.slice(-5);
  let w=0,wsum=0;
  recent.forEach((r,i)=>{const wi=weights[recent.length-1-i]||0.08;w+=r*wi;wsum+=wi;});
  return wsum>0?w/wsum:40;
}

function estimateWinProb(horse,allHorses){
  const ratings=allHorses.map(h=>calcSpeedRating(h.name||''));
  const softmax=ratings.map(r=>Math.exp(r/10));
  const total=softmax.reduce((a,b)=>a+b,0);
  const idx=allHorses.indexOf(horse);
  return softmax[idx]/total;
}

// ══════════════════════════════════════════════════════════
// BUG FIX A: 今週フィルター
// ══════════════════════════════════════════════════════════
function getThisWeekPrefix(){
  const d=new Date();
  // 土日をまたいでも正しく「この週末」を返す
  // → 直近の土曜を基準に年月を取る
  const day=d.getDay(); // 0=日,6=土
  const diff=day===0?-1:day===6?0:6-day; // 直近または今週土曜までの日数
  const sat=new Date(d);
  sat.setDate(d.getDate()+diff);
  const y=sat.getFullYear();
  const m=String(sat.getMonth()+1).padStart(2,'0');
  return `${y}${m}`;
}

// ══════════════════════════════════════════════════════════
// BUG FIX B + RMRF 2.1 Step D: buildPicks
// - 今週フィルター（先週データ除去）
// - オッズ確定チェック（EV異常値除去）
// - レース内マルチ馬の合計上限管理（相互排他制約）
// ══════════════════════════════════════════════════════════
function buildPicks(){
  allPicks=[];
  const prefix=getThisWeekPrefix();

  for(const race of shuTubaData){
    // [FIX A] 今週フィルター
    if(!race.id?.startsWith(prefix)) continue;

    // [FIX B] オッズ未確定はスキップ（EV異常値の根本原因）
    const hasOdds=race.horses?.some(h=>h.odds>0);
    if(!hasOdds) continue;

    // 出走頭数フィルター（8頭未満は歪みが出やすい）
    if((race.horses?.length||0)<8) continue;

    const picksInRace=[];

    race.horses?.forEach(h=>{
      if(!h.odds||h.odds<3.0) return; // Odds≥3.0フィルター

      // 確率推定（スピード指数 or オッズベース）
      let p;
      if(racesData.length>=50){
        p=estimateWinProb(h,race.horses);
      }else{
        // データ不足時: 市場オッズから逆算 + 控除率補正
        // 単勝控除率≈20%を補正
        const rawP=1/h.odds;
        const sumRawP=race.horses.filter(x=>x.odds>0).reduce((s,x)=>s+1/x.odds,0);
        p=rawP/sumRawP*0.80; // 規格化 × 控除率
      }

      const ev=p*h.odds-1;
      const rrr=p*h.odds;

      if(ev<0.20||rrr<2.0) return;

      picksInRace.push({horse:h,p,ev,rrr,race});
    });

    // [RMRF 2.1 Step D] レース内相互排他制約: 合計Kelly≤2%
    // 凸最適化の精神を簡易実装: 按分縮小
    if(picksInRace.length>0){
      const bankroll=getBankroll();
      const lam=rmrfState.currentLambda??rmrfState.lambdaMax;

      // 各馬のKelly計算
      picksInRace.forEach(pick=>{
        const {p,horse:{odds}}=pick;
        const rawKelly=(p*(odds-1)-(1-p))/(odds-1);
        pick.rawKelly=Math.max(0,rawKelly);
        pick.kelly=rawKelly*lam*0.25; // 1/4Kelly×λ
      });

      // 合計が2%を超えたら按分縮小（相互排他制約）
      const totalKelly=picksInRace.reduce((s,p)=>s+p.kelly,0);
      const RACE_CAP=0.02;
      if(totalKelly>RACE_CAP){
        const scale=RACE_CAP/totalKelly;
        picksInRace.forEach(p=>{p.kelly*=scale;p.scaledDown=true;});
      }

      picksInRace.forEach(pick=>{
        pick.betAmt=Math.floor(bankroll*pick.kelly/100)*100;
        allPicks.push(pick);
      });
    }
  }

  renderWeek();
}

function getBankroll(){
  // 収支記録から現在の銀行ロールを計算
  const initial=100000;
  const pnl=records.reduce((s,r)=>{
    const b=Number(r.betAmt)||0;
    return r.result==='win'?s+(Number(r.odds||0)-1)*b:s-b;
  },0);
  return initial+pnl;
}

  // ピックのないレースも表示（EV計算用）

  shuTubaData
    .filter(r=>r.id?.startsWith(prefix))

  keys.sort((a,b)=>(raceMap[b].picks.length>0?1:-1)-(raceMap[a].picks.length>0?1:-1));

  el.innerHTML=keys.map(id=>{

function showRaceDetail(raceId){
  const race=shuTubaData.find(r=>r.id===raceId);
  if(!race){return;}
  const lam=rmrfState.currentLambda??rmrfState.lambdaMax;

  // 全馬EV計算
  const horsesEV=(race.horses||[]).map(h=>{
    let p,uFlag=false;
    if(h.odds>0){
      if(racesData.length>=50){
        p=estimateWinProb(h,race.horses.filter(x=>x.odds>0));
      }else{
        const rawP=1/h.odds;
        const sumRawP=race.horses.filter(x=>x.odds>0).reduce((s,x)=>s+1/x.odds,0);
        p=rawP/sumRawP*0.80;
        uFlag=true; // データ不足フラグ
      }
    }else{
      p=1/race.horses.length; // オッズ未確定: 均等
      uFlag=true;
    }
    const odds=h.odds||0;
    const ev=odds>0?p*odds-1:-1;
    const rrr=odds>0?p*odds:0;
    const rawK=odds>1?Math.max(0,(p*(odds-1)-(1-p))/(odds-1)):0;
    const kelly=rawK*lam*0.25;
    return{...h,p,ev,rrr,kelly,uFlag};
  });

  // Kelly合計上限（相互排他制約）
  const totalK=horsesEV.reduce((s,h)=>s+h.kelly,0);
  const scale=totalK>0.02?0.02/totalK:1;
  horsesEV.forEach(h=>h.kellyAdj=h.kelly*scale);

  horsesEV.sort((a,b)=>b.ev-a.ev);
  const bankroll=getBankroll();

  document.getElementById('modal-body').innerHTML=`
    <div class="modal-title">${race.name||''} ― 全馬EV分析 <span class="tag tag-rmrf">RMRF 2.1</span></div>
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg3);margin-bottom:10px">
      λ=${lam.toFixed(3)} ｜ 銀行ロール ¥${bankroll.toLocaleString()}
      ${scale<1?` ｜ <span style="color:var(--yellow)">⚠ 相互排他按分 ×${scale.toFixed(2)}</span>`:''}
    </div>
    ${horsesEV.map((h,i)=>{
      const betAmt=Math.floor(bankroll*h.kellyAdj/100)*100;
      const evOk=h.ev>=0.20&&h.rrr>=2.0&&(h.odds||0)>=3.0;
      return `
      <div class="horse-ev-row">
        <div class="horse-rank">${i+1}</div>
        <div class="horse-info">
          <div class="horse-name-big">${h.name||'—'} <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg3)">#${h.number||'?'}</span></div>
          <div class="horse-sub">${h.odds>0?h.odds+'倍':'オッズ未確定'} ｜ 推定P=${(h.p*100).toFixed(1)}%${h.uFlag?' ⚠':''}
            ｜ EV${h.ev>=0?'+':''}${(h.ev*100).toFixed(0)}%</div>
          ${evOk?`<div class="kelly-bar-wrap"><div class="kelly-bar" style="width:${Math.min(100,h.kellyAdj*5000)}%"></div></div>`:''}
        </div>
        ${evOk?`<span style="font-family:var(--font-mono);font-size:11px;color:var(--green);font-weight:700">${betAmt>0?'¥'+betAmt.toLocaleString():'—'}</span>`:
          `<span class="ev-badge" style="background:var(--bg4);color:var(--fg3);border:1px solid var(--border)">SKIP</span>`}
      </div>`;
    }).join('')}
    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-outline" onclick="closeModal()">閉じる</button>
    </div>`;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e){
  if(!e||e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

// ══════════════════════════════════════════════════════════
// RMRF 2.1 Step C: 動的λ計算
// ── Newey-West補正付きt統計量ベース ──
// ══════════════════════════════════════════════════════════

function mean(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;}
function variance(arr){
  if(arr.length<2) return 0;
  const mu=mean(arr);
  return arr.map(x=>(x-mu)**2).reduce((a,b)=>a+b,0)/arr.length;
}
function std(arr){return Math.sqrt(variance(arr));}

/**
 * AR(1)の自己相関ρ₁を推定し、実効サンプルサイズを計算
 * Newey-West標準誤差の簡易版
 */
function effectiveSampleSize(returns){
  const n=returns.length;
  if(n<4) return n;
  const mu=mean(returns);
  const centered=returns.map(x=>x-mu);
  let cov0=0,cov1=0;
  for(let i=0;i<n;i++) cov0+=centered[i]**2;
  for(let i=0;i<n-1;i++) cov1+=centered[i]*centered[i+1];
  const rho1=cov0>0?cov1/cov0:0;
  // 実効サンプルサイズ: n × (1-ρ₁)/(1+ρ₁)
  const nEff=n*(1-rho1)/(1+Math.max(rho1,-0.999));
  return Math.max(1,Math.min(n,nEff));
}

/**
 * 標準正規分布CDF（近似）
 */
function normalCDF(z){
  const t=1/(1+0.2316419*Math.abs(z));
  const poly=t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  const p=1-0.3989422803*Math.exp(-z*z/2)*poly;
  return z>=0?p:1-p;
}

/**
 * RMRF 2.1: 動的Kelly分数λ
 * λ = λmax × Φ(t統計量) × exp(-γ × u) × (1-DD補正)
 *
 * @param {number[]} histReturns - 対数リターン系列 [log(W_t/W_{t-1})]
 * @param {number}   peakDD      - ピーク比ドローダウン率 [0,1]
 * @param {number}   uncertainty - 予測不確実性の平均（0=高信頼）
 * @returns {number} λ
 */
function dynamicLambda(histReturns, peakDD, uncertainty=0){
  const {lambdaMax, ddThreshold, gamma}=rmrfState;

  // データ不足: 極めて保守的
  if(histReturns.length<5) return lambdaMax*0.15;
  if(histReturns.length<10) return lambdaMax*0.25;

  const mu=mean(histReturns);
  const nEff=effectiveSampleSize(histReturns);
  const se=std(histReturns)/Math.sqrt(nEff);
  const tStat=se>0?mu/se:0;

  // Φ(t): t統計量からエッジ信頼度を[0,1]に変換
  const edgeConfidence=normalCDF(tStat);

  // 不確実性ペナルティ: exp(-γu)
  const uncertaintyPenalty=Math.exp(-gamma*uncertainty);

  let lam=lambdaMax*edgeConfidence*uncertaintyPenalty;

  // ドローダウン補正
  if(peakDD>ddThreshold){
    lam*=(1-peakDD);
    if(peakDD>ddThreshold+0.05){
      // Kill Switch
      systemRunning=false;
      document.getElementById('kill-badge').textContent='● STOPPED';
      document.getElementById('kill-badge').className='kill-badge stopped';
    }
  }

  return Math.max(0,Math.min(lam,lambdaMax));
}

/**
 * 収支記録から対数リターン系列とDDを計算してλを更新
 */
function updateLambda(){
  if(records.length===0){
    rmrfState.currentLambda=rmrfState.lambdaMax*0.15;
    rmrfState.lambdaHistory=[];
    saveLocal();
    return;
  }

  let wealth=1.0, peak=1.0;
  let peakDD=0;
  const logReturns=[];

  // 1/4Kelly調整前の「バンクロール比リターン」を計算
  records.forEach(r=>{
    const betFrac=(Number(r.betAmt)||0)/100000; // 初期BRに対する比率
    if(betFrac<=0) return;
    const logR=r.result==='win'
      ? Math.log(1+betFrac*(Number(r.odds||1)-1))
      : Math.log(1-betFrac);
    logReturns.push(logR);
    wealth*=Math.exp(logR);
    peak=Math.max(peak,wealth);
    peakDD=Math.max(peakDD,1-wealth/peak);
  });

  // RMRF 2.1: 予測不確実性（データ量から推定）
  // データ200件未満: 不確実性高, 1000件超: 不確実性低
  const n=racesData.length;
  const uncertainty=n<200?0.8:n<500?0.5:n<1000?0.2:0.05;

  const lam=dynamicLambda(logReturns, peakDD, uncertainty);
  rmrfState.currentLambda=lam;
  rmrfState.peakDD=peakDD;
  rmrfState.logReturns=logReturns;
  rmrfState.lastTStat=logReturns.length>=10
    ? (mean(logReturns)/(std(logReturns)/Math.sqrt(effectiveSampleSize(logReturns))))||0
    : null;

  // λ履歴に追記
  if(!rmrfState.lambdaHistory) rmrfState.lambdaHistory=[];
  rmrfState.lambdaHistory.push(lam);
  if(rmrfState.lambdaHistory.length>50) rmrfState.lambdaHistory.shift();

  saveLocal();
}

/**
 * λバーUI更新
 */
function renderLambdaBar(){
  updateLambda();
  const lam=rmrfState.currentLambda??rmrfState.lambdaMax;
  const pct=lam/rmrfState.lambdaMax;
  const fill=document.getElementById('lambda-fill');
  const valEl=document.getElementById('lambda-val');
  const badgeEl=document.getElementById('edge-badge');

  fill.style.width=`${pct*100}%`;
  fill.style.background=pct>0.7?'var(--green)':pct>0.4?'var(--yellow)':'var(--red)';
  valEl.style.color=pct>0.7?'var(--green)':pct>0.4?'var(--yellow)':'var(--red)';
  valEl.textContent=lam.toFixed(3);

  const ts=rmrfState.lastTStat;
  if(ts===null){
    badgeEl.textContent='N/A';
    badgeEl.style.background='var(--bg4)';
    badgeEl.style.color='var(--fg3)';
  }else{
    badgeEl.textContent=`t=${ts.toFixed(2)}`;
    const sig=Math.abs(ts)>1.96;
    badgeEl.style.background=sig?(ts>0?'var(--green-dim)':'var(--red-dim)'):'var(--bg4)';
    badgeEl.style.color=sig?(ts>0?'var(--green)':'var(--red)'):'var(--fg3)';
    badgeEl.style.border=sig?`1px solid ${ts>0?'var(--green)':'var(--red)'}`:'none';
  }
}

}
function calcEV(){
  if(horses.length===0){toast('馬を追加してください');return;}
  const bankroll=Number(document.getElementById('calc-bankroll').value)||100000;
  const lam=rmrfState.currentLambda??rmrfState.lambdaMax;

  // 各馬のKelly計算
  const results=horses.map((h,i)=>{
    const p=Number(h.prob)/100;
    const odds=Number(h.odds);
    if(!p||!odds) return null;
    const ev=p*odds-1;
    const rrr=p*odds;
    const rawK=odds>1?Math.max(0,(p*(odds-1)-(1-p))/(odds-1)):0;
    const kelly=rawK*lam*0.25;
    const ok=ev>=0.20&&rrr>=2.0&&odds>=3.0;
    // UI更新
    const el=document.getElementById(`ev-result-${i}`);
    if(el){
      el.textContent=`EV${ev>=0?'+':''}${(ev*100).toFixed(0)}%`;
      el.className=`ev-result ${ok?'ev-ok':'ev-ng'}`;
    }
    return {i,h,p,odds,ev,rrr,kelly,ok};
  }).filter(Boolean);

  // RMRF 2.1: 相互排他制約（レース内合計Kelly≤2%）
  const validPicks=results.filter(r=>r.ok);
  const totalK=validPicks.reduce((s,r)=>s+r.kelly,0);
  const scale=totalK>0.02?0.02/totalK:1;
  const scaled=scale<1;

  const el=document.getElementById('calc-result');
  const body=document.getElementById('calc-result-body');
  el.style.display='block';

  if(validPicks.length===0){
    body.innerHTML=`<div style="font-family:var(--font-mono);font-size:12px;color:var(--fg3)">全条件通過馬なし（EV≥20% AND RRR≥2.0 AND Odds≥3.0）</div>`;
    return;
  }

  body.innerHTML=`
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg3);margin-bottom:8px">
      λ=${lam.toFixed(3)} ｜ 1/4Kelly×λ ｜ 銀行ロール¥${bankroll.toLocaleString()}
      ${scaled?` ｜ <span style="color:var(--yellow)">⚠ 相互排他按分 ×${scale.toFixed(2)}</span>`:''}
    </div>
    ${validPicks.map(r=>{
      const adjKelly=r.kelly*scale;
      const betAmt=Math.floor(bankroll*adjKelly/100)*100;
      return `
      <div class="pick-row" style="margin-bottom:6px">
        <span class="pick-horse">${r.h.name||`馬${r.i+1}`}</span>
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg2)">${r.odds}倍</span>
        <span class="ev-badge strong">EV+${(r.ev*100).toFixed(0)}%</span>
        <span style="font-family:var(--font-mono);font-size:12px;color:var(--green);font-weight:700">¥${betAmt.toLocaleString()}</span>
      </div>`;
    }).join('')}
    <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg3);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">
      ※ 全条件: EV≥20% AND RRR≥2.0 AND Odds≥3.0<br>
      ※ 合計ベット上限: 銀行ロールの2%
    </div>`;
  if(!horses.length) horses=[{name:'',prob:'',odds:''}],renderHorseList();
}

function saveRecord(){
  const horse=document.getElementById('r-horse').value.trim();
  const race=document.getElementById('r-race').value.trim();
  const myP=Number(document.getElementById('r-myp').value);
  const odds=Number(document.getElementById('r-odds').value);
  const betAmt=Number(document.getElementById('r-bet').value);
  const result=document.getElementById('r-result').value;
  if(!horse||!betAmt||!odds){toast('馬名・オッズ・ベット額は必須');return;}

  const rec={id:Date.now(),horse,race,myP,odds,betAmt,result,date:new Date().toISOString().slice(0,10)};
  records.push(rec);

  // RMRF 2.1 Step E: 較正データに追記
  if(myP>0&&odds>0){
    const mktP=1/odds;
    rmrfState.calibData=rmrfState.calibData||[];
    rmrfState.calibData.push({myP:myP/100,mktP,won:result==='win',date:rec.date});
    if(rmrfState.calibData.length>200) rmrfState.calibData.shift();
  }

  saveLocal();
  closeModal();
  renderLambdaBar();
  renderRecords();
  toast('記録を保存しました');
}
function deleteRecord(id){
  records=records.filter(r=>r.id!==id);
  saveLocal();
  renderLambdaBar();
  renderRecords();
}
function renderRecords(){
  const el=document.getElementById('record-list');
  if(records.length===0){el.innerHTML='<div class="empty">記録なし</div>';return;}
  const sorted=[...records].sort((a,b)=>b.id-a.id);
  el.innerHTML=sorted.map(r=>{
    const pnl=r.result==='win'?(r.odds-1)*r.betAmt:(-r.betAmt);
    return `
    <div class="record-row">
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg3);width:52px">${r.date?.slice(5)||''}</div>
      <div class="record-horse">${r.horse}<br><span style="font-family:var(--font-mono);font-size:9px;color:var(--fg3)">${r.race||''} ${r.odds}倍</span></div>
      <span class="record-result ${r.result==='win'?'result-win':'result-lose'}">${r.result==='win'?'的中':'不的中'}</span>
      <span class="record-pnl ${pnl>0?'':''}">
        <span style="color:${pnl>0?'var(--green)':'var(--red)'}">${pnl>0?'+':''}¥${pnl.toLocaleString()}</span>
      </span>
      <button class="rm-btn" onclick="deleteRecord(${r.id})">✕</button>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════
// 分析タブ
// ══════════════════════════════════════════════════════════
function renderStats(){
  const bankroll=getBankroll();
  const initial=100000;
  const pnl=bankroll-initial;
  const roi=records.length>0?(pnl/records.reduce((s,r)=>s+r.betAmt,0)*100)||0:0;
  const wins=records.filter(r=>r.result==='win').length;
  const hitRate=records.length>0?wins/records.length*100:0;
  const dd=(rmrfState.peakDD||0)*100;

  document.getElementById('stat-grid').innerHTML=`
    <div class="stat-box">
      <div class="stat-label">BANKROLL</div>
      <div class="stat-val ${pnl>=0?'pos':'neg'}">¥${bankroll.toLocaleString()}</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">TOTAL P&L</div>
      <div class="stat-val ${pnl>=0?'pos':'neg'}">${pnl>=0?'+':''}¥${pnl.toLocaleString()}</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">ROI</div>
      <div class="stat-val ${roi>=0?'pos':'neg'}">${roi.toFixed(1)}%</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">HIT RATE</div>
      <div class="stat-val neu">${hitRate.toFixed(0)}%<span style="font-size:12px;color:var(--fg3)"> (${wins}/${records.length})</span></div>
    </div>`;

  // λ履歴ミニチャート
  renderLambdaChart();

  // λ説明文
  const ts=rmrfState.lastTStat;
  const lam=rmrfState.currentLambda??rmrfState.lambdaMax;
  const uncertainty=racesData.length<200?0.8:racesData.length<500?0.5:racesData.length<1000?0.2:0.05;
  document.getElementById('lambda-explain').innerHTML=
    `λ = ${rmrfState.lambdaMax} × Φ(${ts!=null?ts.toFixed(2):'N/A'}) × exp(-${rmrfState.gamma}×${uncertainty.toFixed(2)}) = ${lam.toFixed(4)}<br>`+
    `実効サンプルn_eff: ${(rmrfState.logReturns?.length?effectiveSampleSize(rmrfState.logReturns):0).toFixed(0)}件 ｜ データ不確実性: ${(uncertainty*100).toFixed(0)}%<br>`+
    `MaxDD: ${dd.toFixed(1)}% ｜ Kill Switch: DD>${(rmrfState.ddThreshold*100).toFixed(0)}%`;

  // 較正
  renderCalib();

  // DD
  document.getElementById('dd-body').innerHTML=`
    <div style="display:flex;align-items:center;gap:10px">
      <div style="flex:1">
        <div class="stat-label">MAX DRAWDOWN</div>
        <div class="stat-val ${dd>20?'neg':dd>10?'':''}" style="font-size:22px;color:${dd>20?'var(--red)':dd>10?'var(--yellow)':'var(--green)'}">${dd.toFixed(1)}%</div>
      </div>
      <div style="text-align:right;font-family:var(--font-mono);font-size:10px;color:var(--fg3)">
        Kill Switch閾値: 20%<br>
        λ縮小開始: 20%
      </div>
    </div>`;
}

function renderLambdaChart(){
  const hist=rmrfState.lambdaHistory||[];
  const el=document.getElementById('lambda-history-chart');
  if(hist.length<2){el.innerHTML='<div style="font-family:var(--font-mono);font-size:10px;color:var(--fg3)">収支記録が増えると表示されます</div>';return;}
  const max=rmrfState.lambdaMax;
  const w=el.offsetWidth||300;
  const h=60;
  const step=w/Math.max(hist.length-1,1);
  const pts=hist.map((v,i)=>`${i*step},${h-(v/max)*h}`).join(' ');
  el.innerHTML=`<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="var(--green)" stop-opacity=".4"/>
      <stop offset="100%" stop-color="var(--green)" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${pts} ${(hist.length-1)*step},${h} 0,${h}" fill="url(#lg)"/>
    <polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="1.5"/>
    <line x1="0" y1="${h-(0.5)*h}" x2="${w}" y2="${h-(0.5)*h}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>
  </svg>
  <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--fg3);margin-top:2px">
    <span>${hist.length}件前</span><span>現在 λ=${hist[hist.length-1].toFixed(3)}</span>
  </div>`;
}

// RMRF 2.1 Step E: 較正（Calibration）レンダリング
function renderCalib(){
  const el=document.getElementById('calib-body');
  const data=rmrfState.calibData||[];
  if(data.length<10){
    el.innerHTML='<div class="empty" style="padding:10px;font-size:10px">的中記録が10件以上で表示されます</div>';
    return;
  }

  // 自社確率をバケット（0-20%, 20-40%, 40-60%, 60-80%, 80-100%）に分類
  const buckets=[
    {label:'0〜20%',min:0,max:0.2,records:[]},
    {label:'20〜40%',min:0.2,max:0.4,records:[]},
    {label:'40〜60%',min:0.4,max:0.6,records:[]},
    {label:'60〜80%',min:0.6,max:0.8,records:[]},
    {label:'80〜100%',min:0.8,max:1.0,records:[]},
  ];
  data.forEach(d=>{
    const b=buckets.find(b=>d.myP>=b.min&&d.myP<b.max);
    if(b) b.records.push(d);
  });

  el.innerHTML=buckets.filter(b=>b.records.length>0).map(b=>{
    const actualWinRate=b.records.filter(d=>d.won).length/b.records.length;
    const avgMyP=mean(b.records.map(d=>d.myP));
    const avgMktP=mean(b.records.map(d=>d.mktP));
    const diff=avgMyP-actualWinRate; // 正=過大評価, 負=過小評価
    const barColor=Math.abs(diff)<0.05?'var(--green)':Math.abs(diff)<0.10?'var(--yellow)':'var(--red)';
    return `
    <div class="calib-row">
      <div class="calib-label">${b.label}</div>
      <div style="flex:1">
        <div style="display:flex;gap:4px;align-items:center;margin-bottom:2px">
          <div style="width:${avgMyP*80}px;height:4px;background:var(--blue);border-radius:2px"></div>
          <span style="font-family:var(--font-mono);font-size:9px;color:var(--blue)">自社${(avgMyP*100).toFixed(0)}%</span>
        </div>
        <div style="display:flex;gap:4px;align-items:center;margin-bottom:2px">
          <div style="width:${actualWinRate*80}px;height:4px;background:${barColor};border-radius:2px"></div>
          <span style="font-family:var(--font-mono);font-size:9px;color:${barColor}">実績${(actualWinRate*100).toFixed(0)}%</span>
        </div>
        <div style="display:flex;gap:4px;align-items:center">
          <div style="width:${avgMktP*80}px;height:4px;background:var(--fg3);border-radius:2px"></div>
          <span style="font-family:var(--font-mono);font-size:9px;color:var(--fg3)">市場${(avgMktP*100).toFixed(0)}%</span>
        </div>
      </div>
      <div class="calib-val" style="color:${barColor}">${diff>=0?'+':''}${(diff*100).toFixed(0)}%<br><span style="color:var(--fg3);font-size:9px">n=${b.records.length}</span></div>
    </div>`;
  }).join('')||'<div class="empty" style="padding:10px;font-size:10px">データなし</div>';
}

// ══════════════════════════════════════════════════════════
// Toast
// ══════════════════════════════════════════════════════════
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}
