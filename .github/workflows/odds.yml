name: オッズ収集

on:
  workflow_dispatch:
  schedule:
    # 土日の日本時間 09:00, 10:00, 11:00, 12:00, 13:00, 14:00, 15:00
    # UTC: 00:00, 01:00, 02:00, 03:00, 04:00, 05:00, 06:00
    - cron: '0 0 * * 6'
    - cron: '0 1 * * 6'
    - cron: '0 2 * * 6'
    - cron: '0 3 * * 6'
    - cron: '0 4 * * 6'
    - cron: '0 5 * * 6'
    - cron: '0 6 * * 6'
    - cron: '0 0 * * 0'
    - cron: '0 1 * * 0'
    - cron: '0 2 * * 0'
    - cron: '0 3 * * 0'
    - cron: '0 4 * * 0'
    - cron: '0 5 * * 0'
    - cron: '0 6 * * 0'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: |
          cd scripts
          echo '{"type":"module","dependencies":{"node-fetch":"^3.0.0","cheerio":"^1.0.0"}}' > package.json
          npm install

      - run: node scripts/odds.js

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "オッズ更新"
          file_pattern: data/shutuba.json
