name: 競馬データ収集

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存関係インストール
        run: cd scripts && npm init -y && npm install node-fetch cheerio

      - name: データ収集実行
        run: node scripts/collect.js

      - name: データをコミット
        run: |
          git config user.name "keiba-bot"
          git config user.email "bot@keiba.local"
          git pull --rebase origin main
          git add data/
          git diff --staged --quiet || git commit -m "データ更新 $(date '+%Y-%m-%d')"
          git push
