name: 競馬データ収集
on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: |
          cd scripts
          echo '{"type":"module","dependencies":{"node-fetch":"^3.0.0","cheerio":"^1.0.0"}}' > package.json
          npm install

      - run: node scripts/collect.js

      - run: |
          git config user.name "keiba-bot"
          git config user.email "bot@keiba.local"
          git add -f data/races.json
          git diff --staged --quiet || git commit -m "データ更新"
          git push origin HEAD:refs/heads/main
